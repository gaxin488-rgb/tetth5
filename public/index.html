<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="CineZero — nền tảng phim cá nhân triển khai miễn phí trên Cloudflare.">
  <title>CineZero — Xem phim của bạn</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <a class="skip-link" href="#app">Bỏ qua điều hướng</a>
  <header class="site-header" id="siteHeader">
    <a class="brand" href="#home" aria-label="CineZero - Trang chủ">
      <span class="brand-mark" aria-hidden="true">▶</span><span class="brand-copy">CINE<span>ZERO</span><small>YOUR CINEMA</small></span>
    </a>
    <nav class="desktop-nav" aria-label="Điều hướng chính">
      <a href="#home" data-nav="home">Trang chủ</a>
      <a href="#browse/movie" data-nav="movie">Phim lẻ</a>
      <a href="#browse/series" data-nav="series">Phim bộ</a>
      <a href="#favorites" data-nav="favorites">Danh sách</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button search-toggle" id="searchToggle" aria-label="Mở tìm kiếm">⌕</button>
      <button class="icon-button menu-toggle" id="menuToggle" aria-label="Mở menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <div class="search-panel" id="searchPanel" hidden>
    <form id="searchForm" role="search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Tìm theo tên phim, thể loại..." autocomplete="off">
      <button type="button" id="searchClose" aria-label="Đóng tìm kiếm">✕</button>
    </form>
    <div id="searchSuggestions" class="search-suggestions"></div>
  </div>

  <aside class="mobile-menu" id="mobileMenu" aria-label="Menu di động" hidden>
    <a href="#home">Trang chủ</a>
    <a href="#browse/movie">Phim lẻ</a>
    <a href="#browse/series">Phim bộ</a>
    <a href="#favorites">Danh sách của tôi</a>
    <a href="./admin.html">Quản trị</a>
  </aside>

  <main id="app" tabindex="-1">
    <div class="loading-screen"><div class="spinner"></div><p>Đang tải thư viện phim…</p></div>
  </main>

  <footer class="site-footer">
    <div><strong>CINEZERO</strong><p>Nền tảng mẫu dành cho nội dung bạn sở hữu hoặc được phép phân phối.</p></div>
    <div class="footer-links"><a href="#home">Trang chủ</a><a href="./admin.html">Quản trị</a><a href="#home" title="Trạng thái khả dụng sau khi deploy Cloudflare">Trạng thái</a></div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./data/movies-data.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
